name: AgentVerify code scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  sarif:
    name: AgentVerify SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AgentVerify
        run: python -m pip install "agentverify @ git+https://github.com/AgentVerify/agentverify.git@v0.1.0"
      - name: Generate SARIF
        run: agentverify scan . --format sarif --output agentverify.sarif
      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: agentverify.sarif
          category: agentverify
