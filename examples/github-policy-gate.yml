name: AgentVerify policy gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  agentverify-policy:
    name: AgentVerify policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AgentVerify
        run: python -m pip install "agentverify @ git+https://github.com/AgentVerify/agentverify.git@v0.1.0"
      - name: Validate trusted policy composition
        run: >
          agentverify policy agentverify-policy.json
          --trust-root agentverify-policy-trust-root.json
          --require-trusted
      - name: Enforce policy
        run: >
          agentverify scan .
          --format summary
          --policy agentverify-policy.json
          --require-suppression-expiry
