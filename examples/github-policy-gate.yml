name: AgentVerify policy gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  agentverify-policy:
    name: AgentVerify policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AgentVerify
        # Pin an organization-approved release in production, for example:
        # python -m pip install agentverify==0.1.0
        run: python -m pip install agentverify
      - name: Validate policy composition
        run: agentverify policy agentverify-policy.json
      - name: Enforce policy
        run: >
          agentverify scan .
          --format summary
          --policy agentverify-policy.json
          --require-suppression-expiry
