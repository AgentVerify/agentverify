name: AgentVerify benchmark verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-regression:
    name: Verify public regression benchmark results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AgentVerify
        run: python -m pip install agentverify==0.1.0
      - name: Verify checked benchmark result artifacts
        run: >
          agentverify benchmark verify
          --require-evaluation-kind public-regression
          --require-all-passed
          --output agentverify-benchmark-verification.json
      - name: Print benchmark verification summary
        run: >
          agentverify benchmark verify
          --require-evaluation-kind public-regression
          --require-all-passed
          --format summary
      - name: Verify engine metric snapshot
        run: >
          agentverify benchmark verify-engine
          --output agentverify-engine-results-verification.json
      - name: Print engine metric verification summary
        run: >
          agentverify benchmark verify-engine
          --format summary
      - name: Validate holdout setup templates
        run: >
          agentverify holdout validate
          --manifest benchmarks/holdout-manifest.template.json
          --labels benchmarks/holdout-labels.template.json
      - name: Validate verifier JSON
        run: |
          agentverify schema benchmark-verification --output agentverify-benchmark-verification.schema.json
          agentverify schema engine-results-verification --output agentverify-engine-results-verification.schema.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("agentverify-benchmark-verification.schema.json").read_text())
          payload = json.loads(Path("agentverify-benchmark-verification.json").read_text())
          Draft202012Validator(schema).validate(payload)
          engine_schema = json.loads(
              Path("agentverify-engine-results-verification.schema.json").read_text()
          )
          engine_payload = json.loads(
              Path("agentverify-engine-results-verification.json").read_text()
          )
          Draft202012Validator(engine_schema).validate(engine_payload)
          PY
      - name: Upload verifier output
        uses: actions/upload-artifact@v5
        with:
          name: agentverify-benchmark-verification
          path: |
            agentverify-benchmark-verification.json
            agentverify-engine-results-verification.json
