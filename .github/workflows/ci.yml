name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check src tests scripts
      - run: agentverify benchmark verify --require-evaluation-kind public-regression --require-all-passed
      - run: agentverify holdout validate --manifest benchmarks/holdout-manifest.template.json --labels benchmarks/holdout-labels.template.json
      - run: python scripts/verify_signed_policy_example.py
      - run: agentverify scan examples/safe_agent --fail-on high
      - run: agentverify scan cases/python_dangerous --format sarif --output /tmp/agentverify.sarif
      - run: python -m json.tool /tmp/agentverify.sarif > /dev/null
