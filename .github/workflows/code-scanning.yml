name: AgentVerify code scanning

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  agentverify:
    name: AgentVerify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AgentVerify
        run: python -m pip install .
      - name: Scan repository
        # This project keeps intentionally vulnerable regression cases outside src/.
        run: agentverify scan src --format sarif --output agentverify.sarif
      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: agentverify.sarif
          category: agentverify
      - name: Enforce AgentVerify policy
        run: agentverify scan src --policy examples/ci-policy.json
