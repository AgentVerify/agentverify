[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentverify"
version = "0.1.0"
description = "Static analysis and governance checks for AI agent applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentVerify contributors" }]
dependencies = ["cryptography>=46.0"]

[project.scripts]
agentverify = "agentverify.cli:main"

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
