[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentverify"
version = "0.1.0"
description = "Static analysis and governance checks for AI agent applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentVerify contributors" }]
maintainers = [{ name = "Steven Rosa", email = "stevenrosafan@icloud.com" }]
keywords = ["ai-agents", "static-analysis", "mcp", "security", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "cryptography>=46.0",
  "jsonschema>=4.23",
]

[project.urls]
Homepage = "https://github.com/AgentVerify/agentverify"
Documentation = "https://github.com/AgentVerify/agentverify/tree/main/docs"
Repository = "https://github.com/AgentVerify/agentverify"
Issues = "https://github.com/AgentVerify/agentverify/issues"
Changelog = "https://github.com/AgentVerify/agentverify/blob/main/CHANGELOG.md"

[project.scripts]
agentverify = "agentverify.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
