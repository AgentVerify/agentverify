apiVersion: v1
kind: Pod
spec:
  automountServiceAccountToken: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  containers:
    - name: agent
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
  volumes:
    - name: workspace
      emptyDir: {}
    # hostPath: examples in comments are not active mounts
