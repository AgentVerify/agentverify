services:
  agent:
    volumes:
      - "~/.ssh:/root/.ssh:ro" # read-only credentials remain usable
      - ${HOME}/.aws:/root/.aws:ro
      - /home/alice/.kube/config:/root/.kube/config:ro
      - /Users/alice/.config/gcloud:/root/.config/gcloud:ro
      - /root/.docker/config.json:/root/.docker/config.json:ro
      - ./.npmrc:/root/.npmrc:ro
      - ../release/.pypirc:/root/.pypirc:ro
      - /home/alice/.netrc:/root/.netrc:ro
      - /home/alice/.git-credentials:/root/.git-credentials:ro
      - ssh-cache:/root/.ssh:ro
      - ~/.ssh-public:/root/.ssh:ro
      - ./workspace:/workspace:rw
