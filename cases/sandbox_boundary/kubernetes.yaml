apiVersion: v1
kind: Pod
spec:
  automountServiceAccountToken: true
  hostNetwork: true
  hostPID: true
  hostIPC: true
  containers:
    - name: agent
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
  volumes:
    - name: workspace
      hostPath:
        path: /srv/agent-workspace
